<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Later</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #08111E;
    color: #F4F7FB;
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    padding: 32px 24px 28px;
    border-radius: 26px;
    background: #132235;
    border: 1px solid rgba(142, 187, 255, 0.20);
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.48);
    text-align: center;
  }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 18px; letter-spacing: -0.02em; }
  p { font-size: 13px; color: #9BB0C9; opacity: 0.75; margin: 12px 0 0; }
  .btn {
    width: 100%;
    min-height: 54px;
    border-radius: 999px;
    border: 0;
    background: #FFFFFF;
    color: #17263B;
    font-weight: 750;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
  }
  .btn.return-btn {
    background: linear-gradient(115deg, #2E64B0 0%, #4282DB 100%);
    color: #FFFFFF;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1 id="headingText">Continue with Google</h1>
    <button class="btn" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/><path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 11.2 0 13.5s.6 4.5 1.6 6.5l3.7-2.9z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 21.4 7.4 24 12 24z"/></svg>
      <span>Continue with Google</span>
    </button>
    <a class="btn return-btn" id="returnAppBtn" href="#">Continue to Little Later</a>
    <p id="statusText"></p>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const app = initializeApp({
      apiKey: "AIzaSyB892SNxeXdCML_APdGchJzF6k6hAVtbsE",
      authDomain: "littlelater-61969.firebaseapp.com",
      projectId: "littlelater-61969"
    });
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    function sendUserBackToApp(user) {
      const payloadUrl = `https://harsh-alt-max.github.io/little-later/google-auth.html?googleEmail=${encodeURIComponent(user.email)}&googleName=${encodeURIComponent(user.displayName || '')}`;
      const appIntent = `intent:#Intent;action=android.intent.action.SEND;type=text/plain;package=com.littlelater.app;S.android.intent.extra.TEXT=${encodeURIComponent(payloadUrl)};S.browser_fallback_url=${encodeURIComponent('https://harsh-alt-max.github.io/little-later/')};end`;
      document.getElementById("headingText").textContent = `Welcome, ${user.displayName || user.email.split('@')[0]}`;
      document.getElementById("googleBtn").style.display = "none";
      const retBtn = document.getElementById("returnAppBtn");
      retBtn.style.display = "flex";
      retBtn.href = appIntent;
      window.location.href = appIntent;
    }

    getRedirectResult(auth).then((result) => {
      if (result && result.user) sendUserBackToApp(result.user);
    }).catch((err) => {
      if (err && err.message) document.getElementById("statusText").textContent = err.message;
    });

    document.getElementById("googleBtn").onclick = async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        if (result && result.user) sendUserBackToApp(result.user);
      } catch (err) {
        if (err.code === "auth/popup-blocked" || err.code === "auth/operation-not-supported-in-this-environment") {
          await signInWithRedirect(auth, provider);
        } else {
          document.getElementById("statusText").textContent = err.message;
        }
      }
    };
  </script>
</body>
</html>
