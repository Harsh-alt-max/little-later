<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in with Google · Little Later</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #08111E;
    color: #F4F7FB;
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 400px;
    padding: 28px 24px;
    border-radius: 26px;
    background: #132235;
    border: 1px solid rgba(142, 187, 255, 0.24);
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.48);
    text-align: center;
  }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { font-size: 13.5px; color: #9BB0C9; margin: 0 0 20px; line-height: 1.5; }
  .btn {
    width: 100%;
    min-height: 52px;
    border-radius: 999px;
    border: 0;
    background: #FFFFFF;
    color: #17263B;
    font-weight: 750;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Sign in with Google</h1>
    <p id="statusText">Verify your Google account for Little Later.</p>
    <button class="btn" id="googleBtn">Continue with Google</button>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const app = initializeApp({
      apiKey: "AIzaSyB892SNxeXdCML_APdGchJzF6k6hAVtbsE",
      authDomain: "littlelater-61969.firebaseapp.com",
      projectId: "littlelater-61969"
    });
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    document.getElementById("googleBtn").onclick = async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        document.getElementById("statusText").textContent = `Signed in as ${user.email}! Returning to Little Later...`;
        const returnLink = `https://harsh-alt-max.github.io/little-later/?googleEmail=${encodeURIComponent(user.email)}&googleName=${encodeURIComponent(user.displayName || '')}`;
        location.href = `intent://join?googleEmail=${encodeURIComponent(user.email)}&googleName=${encodeURIComponent(user.displayName || '')}#Intent;scheme=littlelater;package=com.littlelater.app;S.browser_fallback_url=${encodeURIComponent(returnLink)};end`;
      } catch (err) {
        document.getElementById("statusText").textContent = err.message;
      }
    };
  </script>
</body>
</html>
