<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Later · Collab Invite</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #08111E;
    color: #F4F7FB;
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    padding: 32px 24px 28px;
    border-radius: 26px;
    background: #132235;
    border: 1px solid rgba(142, 187, 255, 0.20);
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.48);
    text-align: center;
  }
  h1 {
    font-size: 25px;
    line-height: 1.22;
    font-weight: 800;
    margin: 0 0 8px;
    letter-spacing: -0.03em;
  }
  p {
    font-size: 14px;
    line-height: 1.4;
    color: #9BB0C9;
    opacity: 0.72;
    margin: 0 0 24px;
    font-weight: 500;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 54px;
    border-radius: 999px;
    border: 0;
    text-decoration: none;
    font-weight: 750;
    font-size: 15.5px;
    background: linear-gradient(115deg, #2E64B0 0%, #4282DB 100%);
    color: #FFFFFF;
    box-shadow: 0 10px 24px rgba(46, 100, 176, 0.34);
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .btn:active {
    transform: scale(0.96);
  }
</style>
</head>
<body>
  <div class="card">
    <h1 id="inviteHeading">Invited for Collab</h1>
    <p id="folderLabel"></p>
    <a class="btn" id="joinCollabBtn" href="https://harsh-alt-max.github.io/little-later/">Join Collab</a>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const folder = params.get('join') || params.get('folder') || '';
    const inviter = params.get('by') || params.get('from') || '';

    document.getElementById('inviteHeading').textContent = inviter
      ? `${inviter} invites you for Collab`
      : `Invited for Collab`;

    const folderEl = document.getElementById('folderLabel');
    if (folder) {
      folderEl.textContent = folder;
    } else {
      folderEl.style.display = 'none';
    }

    const joinPayloadUrl = `https://harsh-alt-max.github.io/little-later/join.html?join=${encodeURIComponent(folder || 'Shared')}`;
    const downloadSiteUrl = `https://harsh-alt-max.github.io/little-later/`;
    const isAndroid = /Android/i.test(navigator.userAgent);

    /* Includes category=android.intent.category.BROWSABLE matching our updated AndroidManifest.xml */
    const appIntent = `intent:#Intent;action=android.intent.action.SEND;category=android.intent.category.BROWSABLE;type=text/plain;package=com.littlelater.app;S.android.intent.extra.TEXT=${encodeURIComponent(joinPayloadUrl)};S.browser_fallback_url=${encodeURIComponent(downloadSiteUrl)};end`;

    const btn = document.getElementById('joinCollabBtn');
    btn.href = isAndroid ? appIntent : downloadSiteUrl;
  </script>
</body>
</html>
